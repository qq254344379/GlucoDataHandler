name: Build GlucoDataHandler (Chinese Simplified)

on:
  push:
    branches: [ master, main, keep-alive-enhancement ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build-cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          releasePath=.
          DEXCOM_APPLICATION_ID=""
          DEXCOM_APPLICATION_ID_APAC=""
          NIGHTSCOUT_DEBUG_SERVER=""
          keystore.file=/home/runner/.android/gdh-release.keystore
          keystore.password=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keystore.alias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keystore.key.password=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EOF
          echo "local.properties created:"
          cat local.properties

      - name: Prepare Simplified Chinese resources
        run: |
          if [ -f "common/src/main/res/values/strings.xml" ]; then
            sed -i 's#<string name="locale">en</string>#<string name="locale">zh</string>#' common/src/main/res/values/strings.xml
            echo "locale set to zh"
          fi
          ls -la common/src/main/res/values-zh/ || echo "values-zh missing!"

      - name: Restore fixed debug keystore for stable signing
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          ls -la ~/.android/debug.keystore
          echo "keystore sha256 (expect 862ab90b42152e22f20ed10e85dcd19afcd4488ebfcc4002f2c14d31fcde2fa8):"
          sha256sum ~/.android/debug.keystore

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}" | base64 -d > ~/.android/gdh-release.keystore
          ls -la ~/.android/gdh-release.keystore
          sha256sum ~/.android/gdh-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mobile debug APK
        run: ./gradlew :mobile:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlucoDataHandler-zh-CN
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build mobile release APK
        run: ./gradlew :mobile:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlucoDataHandler-zh-CN-release
          path: mobile/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare release assets (version + build date naming)
        id: prep
        run: |
          VER=$(grep -m1 'project.ext.set("versionName"' build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          CN_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
          mkdir -p release_assets
          cp mobile/build/outputs/apk/debug/GlucoDataHandler_*.apk release_assets/GlucoDataHandler_${VER}_${CN_DATE}_debug.apk
          cp mobile/build/outputs/apk/release/GlucoDataHandler_*.apk release_assets/GlucoDataHandler_${VER}_${CN_DATE}_release.apk
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "date=${CN_DATE}" >> "$GITHUB_OUTPUT"
          ls -lh release_assets/

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.prep.outputs.version }}-${{ steps.prep.outputs.date }}
          name: "GlucoDataHandler v${{ steps.prep.outputs.version }} (${{ steps.prep.outputs.date }})"
          body: |
            Auto-built from branch ${{ github.ref_name }} (run #${{ github.run_number }}).

            - debug APK signed with fixed debug keystore (can overwrite existing debug install)
            - release APK signed with official release keystore
          artifacts: "release_assets/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
